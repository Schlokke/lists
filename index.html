<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lists</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--muted:#7a7a74;--line:rgba(0,0,0,.09);--accent:#2f6fed;--danger:#d6453d;--soft:rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--text:#efeee9;--muted:#9a9a93;--line:rgba(255,255,255,.1);--soft:rgba(255,255,255,.07)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
#app{max-width:560px;margin:0 auto;min-height:100dvh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
.top h1{font-size:24px;font-weight:600;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ib:active{background:var(--soft)}
.sub{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--text);white-space:nowrap}
.chip.sel{background:var(--text);color:var(--bg)}
.chip.l{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.chip.l.off{background:var(--soft);color:var(--muted)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.card{background:var(--card);border:.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card .n{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:16px}
.card .s{font-size:13px;color:var(--muted);margin:3px 0 9px}
.bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.meta{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.meta span.ic{display:flex;align-items:center;gap:3px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;z-index:6}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px;line-height:1.5}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.grp{font-size:12px;color:var(--muted);margin:14px 0 4px;display:flex;align-items:center;gap:6px}
.row{display:flex;gap:12px;padding:12px 0;border-bottom:.5px solid var(--line);align-items:flex-start}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--c);display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.row.done .chk{background:var(--c)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row.done .d{color:var(--muted)}
.main{flex:1;min-width:0}
.t{font-size:16px;line-height:1.35;word-break:break-word}
.d{font-size:14px;color:var(--muted);margin-top:3px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.main .chips{margin-top:8px}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:.5px solid var(--line)}
.lk{display:flex;gap:10px;align-items:center;border:.5px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;background:var(--soft)}
.lk .g{flex:none;width:36px;height:36px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;text-transform:uppercase}
.lk .x{min-width:0;flex:1}
.lk .x b{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .x span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pri{flex:none;font-size:11px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);margin-top:3px}
.addbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:.5px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.addbar div{max-width:560px;margin:0 auto;display:flex;gap:8px}
.fld{width:100%;font:inherit;color:var(--text);background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
.fld:focus{border-color:var(--accent)}
textarea.fld{resize:none;min-height:84px;line-height:1.4}
.btn{padding:0 16px;height:44px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:500;flex:none}
.btn.sec{background:var(--soft);color:var(--text)}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom))}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:600;font-size:17px}
.shh button.ok{color:var(--accent);font-weight:600;padding:6px 4px}
.lab{font-size:12px;color:var(--muted);margin:16px 0 6px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);font-weight:500;box-shadow:0 0 0 .5px var(--line)}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs .im{position:relative;width:80px;height:80px}
.imgs img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.imgs .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center}
.imgs .add{width:80px;height:80px;border-radius:10px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.flex{display:flex;gap:8px;align-items:center}
.lkrow{display:flex;gap:8px;align-items:center}
.lkrow .lk{flex:1;margin-top:8px;min-width:0}
.lkrow .ib{margin-top:8px}
.danger{color:var(--danger);width:100%;padding:14px;margin-top:22px;border-radius:12px;background:var(--soft);font-weight:500}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-bottom:.5px solid var(--line);text-align:left}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.hide{display:none}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fi" accept="image/*" multiple class="hide">
<input type="file" id="fj" accept="application/json,.json" class="hide">
<script>
(function(){
'use strict';
var PRI={1:{n:'Low',c:'#2f9e5b'},2:{n:'Medium',c:'#d9902b'},3:{n:'High',c:'#d6453d'}};
var COLORS=['#d6453d','#2f9e5b','#2f6fed','#8b5cf6','#d9902b','#0d9488','#d9488f','#6b7280'];
var P={
plus:'M12 5v14M5 12h14',back:'M15 6l-6 6 6 6',check:'M5 12l5 5L20 7',flag:'M5 21V4m0 0h11l-2 4 2 4H5',
tag:'M3 12V4h8l10 10-8 8L3 12zM8 8h.01',image:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9h.01',
link:'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',
trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',pin:'M9 4h6l-1 6 3 3H7l3-3-1-6zM12 13v7',
dots:'M12 6h.01M12 12h.01M12 18h.01',x:'M6 6l12 12M18 6L6 18',chev:'M6 9l6 6 6-6',chevr:'M9 6l6 6-6 6'};
function icon(n,s){s=s||20;var w=n==='dots'?3:2;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"><path d="'+P[n]+'"/></svg>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function openUrl(u){var B=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Browser;if(B&&B.open){B.open({url:u});return;}window.open(u,'_blank','noopener');}
function exportBackup(){var json=JSON.stringify(S),file=null;try{file=new File([json],'lists-backup.json',{type:'application/json'});}catch(e){}
 if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Lists backup'}).catch(function(){});return;}
 var blob=new Blob([json],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lists-backup.json';document.body.appendChild(a);a.click();a.remove();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

var S=null,ui={view:'home',listId:null,filter:null,doneOpen:true},stack=[],skip=0,saveT=null;

/* storage: IndexedDB with localStorage fallback */
function idb(){return new Promise(function(res,rej){try{var r=indexedDB.open('todo-lists',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
function dbGet(k){return idb().then(function(db){return new Promise(function(res,rej){var q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}).catch(function(){try{var v=localStorage.getItem('tl_'+k);return v?JSON.parse(v):undefined;}catch(e){return undefined;}});}
function dbSet(k,v){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=function(){rej(t.error);};});}).catch(function(){try{localStorage.setItem('tl_'+k,JSON.stringify(v));}catch(e){}});}
function save(){clearTimeout(saveT);saveT=setTimeout(flush,300);}
function flush(){clearTimeout(saveT);if(S)dbSet('state',S);}
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',function(){if(document.hidden)flush();});

function seed(){
 var lb=[{id:'l1',name:'Work',color:COLORS[0]},{id:'l2',name:'Home',color:COLORS[1]},{id:'l3',name:'Travel',color:COLORS[2]},{id:'l4',name:'Personal',color:COLORS[3]}];
 var now=Date.now();
 return {labels:lb,lists:[{id:uid(),name:'Getting started',pinned:true,updated:now,items:[
  {id:uid(),text:'Tap an item to add a description, labels, images or links',desc:'Everything is saved on this device. No internet needed.',done:false,priority:3,labels:['l4'],images:[],links:[],created:now},
  {id:uid(),text:'Tap the circle to check an item off',desc:'',done:false,priority:2,labels:[],images:[],links:[],created:now+1},
  {id:uid(),text:'Create your own list with the plus button',desc:'',done:true,priority:0,labels:[],images:[],links:[],created:now+2,doneAt:now+3}]}]};
}

function getList(){return S.lists.filter(function(l){return l.id===ui.listId;})[0];}
function getLabel(id){return S.labels.filter(function(l){return l.id===id;})[0];}
function getItem(l,id){return l.items.filter(function(i){return i.id===id;})[0];}
function chipL(id){var l=getLabel(id);return l?'<span class="chip l" style="--c:'+l.color+'">'+esc(l.name)+'</span>':'';}
function domain(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}}
function normUrl(u){u=u.trim();if(!u)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;try{new URL(u);return u;}catch(e){return '';}}

/* rendering */
function render(){
 var app=document.getElementById('app');
 var y=window.scrollY;
 app.innerHTML=ui.view==='home'?homeHTML():listHTML();
 window.scrollTo(0,y);
}
function homeHTML(){
 var lists=S.lists.slice().sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||b.updated-a.updated;});
 if(ui.filter)lists=lists.filter(function(l){return l.items.some(function(i){return i.labels.indexOf(ui.filter)>-1;});});
 var h='<div class="top"><h1>My lists</h1><button class="ib" data-act="manage" aria-label="Labels and backup">'+icon('tag')+'</button></div>';
 if(S.labels.length){h+='<div class="filters"><button class="chip'+(ui.filter?'':' sel')+'" data-act="filter" data-id="">All</button>'+S.labels.map(function(l){return '<button class="chip l'+(ui.filter===l.id?'':' off')+'" style="--c:'+l.color+'" data-act="filter" data-id="'+l.id+'">'+esc(l.name)+'</button>';}).join('')+'</div>';}
 if(!lists.length){h+='<div class="empty"><b>Start your first list</b>Tap the plus button to create one.</div>';}
 lists.forEach(function(l){
  var d=l.items.filter(function(i){return i.done;}).length,t=l.items.length,im=0,lk=0,ids={};
  l.items.forEach(function(i){im+=i.images.length;lk+=i.links.length;i.labels.forEach(function(x){ids[x]=1;});});
  h+='<div class="card" data-act="open" data-id="'+l.id+'"><div class="n"><span>'+esc(l.name)+'</span><button class="ib" style="width:32px;height:32px;color:'+(l.pinned?'var(--text)':'var(--muted)')+'" data-act="pin" data-id="'+l.id+'" aria-label="Pin">'+icon('pin',18)+'</button></div>'
  +'<div class="s">'+d+' of '+t+' done</div><div class="bar"><i style="width:'+(t?Math.round(d/t*100):0)+'%"></i></div><div class="meta">'
  +Object.keys(ids).slice(0,4).map(chipL).join('')
  +(im?'<span class="ic">'+icon('image',14)+im+'</span>':'')+(lk?'<span class="ic">'+icon('link',14)+lk+'</span>':'')+'</div></div>';
 });
 return h+'<button class="fab" data-act="newlist" aria-label="New list">'+icon('plus',26)+'</button>';
}
function sortOpen(a,b){return (b.priority-a.priority)||(a.created-b.created);}
function listHTML(){
 var l=getList();if(!l){ui.view='home';return homeHTML();}
 var done=l.items.filter(function(i){return i.done;}).sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0);});
 var open=l.items.filter(function(i){return !i.done;}).sort(sortOpen);
 var h='<div class="top"><button class="ib" data-act="back" aria-label="Back">'+icon('back',22)+'</button><h1 data-act="rename">'+esc(l.name)+'</h1><button class="ib" data-act="listmenu" aria-label="More">'+icon('dots',22)+'</button></div><div class="sub" style="margin-left:48px">Sorted by priority</div>';
 if(done.length){h+='<button class="grp" data-act="donetoggle">'+icon(ui.doneOpen?'chev':'chevr',14)+'Done ('+done.length+')</button>';if(ui.doneOpen)h+=done.map(rowHTML).join('');}
 if(open.length||done.length)h+='<div class="grp">To do ('+open.length+')</div>';
 h+=open.map(rowHTML).join('');
 if(!l.items.length)h+='<div class="empty"><b>No items yet</b>Type below to add your first to-do.</div>';
 return h+'<div class="addbar"><div><input class="fld" id="newitem" placeholder="Add an item" enterkeyhint="done" autocomplete="off"><button class="btn" data-act="additem" aria-label="Add">'+icon('plus')+'</button></div></div>';
}
function rowHTML(it){
 var p=PRI[it.priority],c=p?p.c:'#8a8f98';
 return '<div class="row'+(it.done?' done':'')+'"><button class="chk" style="--c:'+c+'" data-act="toggle" data-id="'+it.id+'" aria-label="Toggle done">'+(it.done?icon('check',14):'')+'</button>'
 +'<div class="main" data-act="edit" data-id="'+it.id+'"><div class="t">'+esc(it.text)+'</div>'+(it.desc?'<div class="d">'+esc(it.desc)+'</div>':'')
 +(it.labels.length?'<div class="chips">'+it.labels.map(chipL).join('')+'</div>':'')
 +(it.images.length?'<div class="thumbs">'+it.images.map(function(s,i){return '<img src="'+esc(s)+'" alt="" data-act="img" data-id="'+it.id+'" data-i="'+i+'">';}).join('')+'</div>':'')
 +it.links.map(function(k,i){return linkHTML(k,'data-act="link" data-id="'+it.id+'" data-i="'+i+'"');}).join('')
 +'</div>'+(p?'<span class="pri" style="--c:'+p.c+'">'+p.n+'</span>':'')+'</div>';
}
function linkHTML(k,attrs){var d=domain(k.url);return '<div class="lk" '+(attrs||'')+'><div class="g">'+esc(d.charAt(0))+'</div><div class="x"><b>'+esc(k.title||d)+'</b><span>'+esc(d)+'</span></div></div>';}

/* overlays + back button */
function pushOverlay(el,onClose){document.body.appendChild(el);stack.push({el:el,onClose:onClose});history.pushState({o:1},'');}
function popTop(){var t=stack.pop();if(!t)return;t.el.remove();if(t.onClose)t.onClose();}
function closeTop(){if(!stack.length)return;popTop();skip++;history.back();}
window.addEventListener('popstate',function(){
 if(skip){skip--;return;}
 if(stack.length){popTop();return;}
 if(ui.view==='list'){ui.view='home';render();window.scrollTo(0,0);}
});
function sheet(html){var bd=document.createElement('div');bd.className='bd';bd.innerHTML='<div class="sheet"><div class="grab"></div>'+html+'</div>';bd.addEventListener('click',function(e){if(e.target===bd)closeTop();});return bd;}
function promptSheet(title,val,ok,cb){
 var bd=sheet('<div class="shh"><span>'+esc(title)+'</span></div><input class="fld" id="ps" value="'+esc(val)+'" placeholder="Name" autocomplete="off"><div class="flex" style="margin-top:12px"><button class="btn sec" style="flex:1" data-s="c">Cancel</button><button class="btn" style="flex:1" data-s="o">'+esc(ok)+'</button></div>');
 var inp=bd.querySelector('#ps');
 function go(){var v=inp.value.trim();if(!v)return;closeTop();cb(v);}
 bd.addEventListener('click',function(e){var b=e.target.closest('[data-s]');if(!b)return;if(b.dataset.s==='c')closeTop();else go();});
 inp.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
 pushOverlay(bd);setTimeout(function(){inp.focus();inp.select();},50);
}
function confirmSheet(msg,ok,cb){
 var bd=sheet('<div class="shh"><span>'+esc(msg)+'</span></div><div class="flex"><button class="btn sec" style="flex:1" data-s="c">Cancel</button><button class="btn" style="flex:1;background:var(--danger);color:#fff" data-s="o">'+esc(ok)+'</button></div>');
 bd.addEventListener('click',function(e){var b=e.target.closest('[data-s]');if(!b)return;closeTop();if(b.dataset.s==='o')cb();});
 pushOverlay(bd);
}
function viewer(src){var v=document.createElement('div');v.className='viewer';v.innerHTML='<img src="'+esc(src)+'" alt="">';v.addEventListener('click',closeTop);pushOverlay(v);}

/* actions */
function touch(l){l.updated=Date.now();save();}
function addItem(){
 var inp=document.getElementById('newitem');if(!inp)return;var v=inp.value.trim();if(!v)return;
 var l=getList();l.items.push({id:uid(),text:v,desc:'',done:false,priority:0,labels:[],images:[],links:[],created:Date.now()});
 touch(l);render();var n=document.getElementById('newitem');if(n)n.focus();
}
function nextColor(){return COLORS[S.labels.length%COLORS.length];}

function openEditor(id){
 var l=getList(),it=getItem(l,id);if(!it)return;
 var bd=sheet('<div class="shh"><span>Edit item</span><button class="ok" data-s="close">Done</button></div>'
 +'<input class="fld" id="e-t" placeholder="What needs doing?" autocomplete="off">'
 +'<textarea class="fld" id="e-d" placeholder="Add a description" style="margin-top:8px"></textarea>'
 +'<div class="lab">Priority</div><div class="seg" id="e-p"></div>'
 +'<div class="lab">Labels</div><div class="chips" id="e-l"></div>'
 +'<div class="flex" style="margin-top:8px"><input class="fld" id="e-nl" placeholder="New label" autocomplete="off"><button class="btn sec" data-s="addlabel">Add</button></div>'
 +'<div class="lab">Images</div><div class="imgs" id="e-i"></div>'
 +'<div class="lab">Links</div><div id="e-k"></div>'
 +'<div class="flex" style="margin-top:8px"><input class="fld" id="e-u" placeholder="Paste a link" inputmode="url" autocomplete="off"><button class="btn sec" data-s="addlink">Add</button></div>'
 +'<button class="danger" data-s="del">Delete item</button>');
 var $=function(s){return bd.querySelector(s);};
 var t=$('#e-t'),d=$('#e-d');t.value=it.text;d.value=it.desc;
 function grow(){d.style.height='auto';d.style.height=Math.max(84,d.scrollHeight)+'px';}
 t.addEventListener('input',function(){it.text=t.value;save();});
 d.addEventListener('input',function(){it.desc=d.value;grow();save();});
 function rP(){$('#e-p').innerHTML=[0,1,2,3].map(function(n){return '<button data-p="'+n+'" class="'+(it.priority===n?'on':'')+'">'+(n?PRI[n].n:'None')+'</button>';}).join('');}
 function rL(){$('#e-l').innerHTML=S.labels.length?S.labels.map(function(x){var on=it.labels.indexOf(x.id)>-1;return '<button class="chip l'+(on?'':' off')+'" style="--c:'+x.color+'" data-lb="'+x.id+'">'+esc(x.name)+'</button>';}).join(''):'<span style="font-size:13px;color:var(--muted)">No labels yet</span>';}
 function rI(){$('#e-i').innerHTML=it.images.map(function(s,i){return '<div class="im"><img src="'+esc(s)+'" alt="" data-v="'+i+'"><button class="rm" data-ri="'+i+'" aria-label="Remove image">'+icon('x',12)+'</button></div>';}).join('')+'<button class="add" data-s="addimg" aria-label="Add image">'+icon('plus',24)+'</button>';}
 function rK(){$('#e-k').innerHTML=it.links.map(function(k,i){return '<div class="lkrow">'+linkHTML(k,'data-ol="'+i+'"')+'<button class="ib" data-rk="'+i+'" aria-label="Remove link">'+icon('x',18)+'</button></div>';}).join('');}
 rP();rL();rI();rK();
 function addLabel(){var inp=$('#e-nl'),v=inp.value.trim();if(!v)return;var ex=S.labels.filter(function(x){return x.name.toLowerCase()===v.toLowerCase();})[0];if(!ex){ex={id:uid(),name:v,color:nextColor()};S.labels.push(ex);}if(it.labels.indexOf(ex.id)<0)it.labels.push(ex.id);inp.value='';save();rL();}
 function addLink(){var inp=$('#e-u'),u=normUrl(inp.value);if(!u){inp.style.borderColor='var(--danger)';return;}inp.style.borderColor='';it.links.push({url:u,title:''});inp.value='';save();rK();}
 $('#e-nl').addEventListener('keydown',function(e){if(e.key==='Enter')addLabel();});
 $('#e-u').addEventListener('keydown',function(e){if(e.key==='Enter')addLink();});
 bd.addEventListener('click',function(e){
  var b;
  if((b=e.target.closest('[data-p]'))){it.priority=+b.dataset.p;save();rP();return;}
  if((b=e.target.closest('[data-lb]'))){var id2=b.dataset.lb,ix=it.labels.indexOf(id2);if(ix>-1)it.labels.splice(ix,1);else it.labels.push(id2);save();rL();return;}
  if((b=e.target.closest('[data-ri]'))){it.images.splice(+b.dataset.ri,1);save();rI();return;}
  if((b=e.target.closest('[data-v]'))){viewer(it.images[+b.dataset.v]);return;}
  if((b=e.target.closest('[data-rk]'))){it.links.splice(+b.dataset.rk,1);save();rK();return;}
  if((b=e.target.closest('[data-ol]'))){openUrl(it.links[+b.dataset.ol].url);return;}
  if((b=e.target.closest('[data-s]'))){
   var a=b.dataset.s;
   if(a==='close')closeTop();
   else if(a==='addlabel')addLabel();
   else if(a==='addlink')addLink();
   else if(a==='addimg'){pickImages(function(list){it.images=it.images.concat(list);save();rI();});}
   else if(a==='del'){confirmSheet('Delete this item?','Delete',function(){l.items=l.items.filter(function(x){return x.id!==it.id;});touch(l);closeTop();});}
  }
 });
 pushOverlay(bd,function(){if(!it.text.trim())it.text='Untitled';touch(l);render();});
 setTimeout(grow,0);
}

/* images */
var imgCb=null;
function pickImages(cb){imgCb=cb;var fi=document.getElementById('fi');fi.value='';fi.click();}
document.getElementById('fi').addEventListener('change',function(e){
 var files=Array.prototype.slice.call(e.target.files||[]);if(!files.length||!imgCb)return;var cb=imgCb;
 Promise.all(files.map(shrink)).then(function(r){cb(r.filter(Boolean));});
});
function shrink(file){return new Promise(function(res){
 var fr=new FileReader();fr.onerror=function(){res(null);};
 fr.onload=function(){var im=new Image();im.onerror=function(){res(null);};
  im.onload=function(){var m=1280,w=im.width,h=im.height,s=Math.min(1,m/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
   var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
   try{res(c.toDataURL('image/jpeg',0.8));}catch(e){res(null);}};
  im.src=fr.result;};
 fr.readAsDataURL(file);});}

/* labels + backup */
function openManage(){
 function body(){return '<div class="shh"><span>Labels and backup</span><button class="ok" data-s="close">Done</button></div>'
 +(S.labels.map(function(x){return '<div class="mi"><span class="dot" style="--c:'+x.color+'"></span><span style="flex:1">'+esc(x.name)+'</span><button class="ib" data-dl="'+x.id+'" aria-label="Delete label">'+icon('trash',18)+'</button></div>';}).join('')||'<div style="color:var(--muted);font-size:14px;padding:8px 0">No labels yet.</div>')
 +'<div class="flex" style="margin-top:12px"><input class="fld" id="m-n" placeholder="New label" autocomplete="off"><button class="btn sec" data-s="add">Add</button></div>'
 +'<div class="lab">Backup</div><div class="flex"><button class="btn sec" style="flex:1" data-s="exp">Export</button><button class="btn sec" style="flex:1" data-s="imp">Import</button></div>';}
 var bd=sheet(body());
 function redo(){bd.querySelector('.sheet').innerHTML='<div class="grab"></div>'+body();}
 bd.addEventListener('click',function(e){
  var b=e.target.closest('[data-dl]');
  if(b){var id=b.dataset.dl;S.labels=S.labels.filter(function(x){return x.id!==id;});S.lists.forEach(function(l){l.items.forEach(function(i){i.labels=i.labels.filter(function(x){return x!==id;});});});if(ui.filter===id)ui.filter=null;save();redo();return;}
  b=e.target.closest('[data-s]');if(!b)return;var a=b.dataset.s;
  if(a==='close')closeTop();
  else if(a==='add'){var inp=bd.querySelector('#m-n'),v=inp.value.trim();if(!v)return;S.labels.push({id:uid(),name:v,color:nextColor()});save();redo();}
  else if(a==='exp'){exportBackup();}
  else if(a==='imp'){var fj=document.getElementById('fj');fj.value='';fj.click();}
 });
 pushOverlay(bd,render);
}
document.getElementById('fj').addEventListener('change',function(e){
 var f=e.target.files&&e.target.files[0];if(!f)return;var fr=new FileReader();
 fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d||!Array.isArray(d.lists)||!Array.isArray(d.labels))throw 0;
  confirmSheet('Replace all current lists with this backup?','Replace',function(){S=d;ui={view:'home',listId:null,filter:null,doneOpen:true};save();render();});}
  catch(err){confirmSheet('That file isn’t a valid backup.','OK',function(){});}};
 fr.readAsText(f);
});

/* main click handling */
document.getElementById('app').addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,id=b.dataset.id,l;
 if(a==='open'){ui.view='list';ui.listId=id;history.pushState({v:'l'},'');render();window.scrollTo(0,0);}
 else if(a==='back'){history.back();}
 else if(a==='pin'){l=S.lists.filter(function(x){return x.id===id;})[0];l.pinned=!l.pinned;save();render();}
 else if(a==='filter'){ui.filter=id||null;render();}
 else if(a==='newlist'){promptSheet('New list','','Create',function(v){var n={id:uid(),name:v,pinned:false,updated:Date.now(),items:[]};S.lists.push(n);save();ui.view='list';ui.listId=n.id;history.pushState({v:'l'},'');render();window.scrollTo(0,0);});}
 else if(a==='manage'){openManage();}
 else if(a==='rename'){l=getList();promptSheet('Rename list',l.name,'Save',function(v){l.name=v;touch(l);render();});}
 else if(a==='listmenu'){
  l=getList();
  var bd=sheet('<button class="mi" data-s="r">Rename list</button><button class="mi" data-s="d" style="color:var(--danger)">Delete list</button>');
  bd.addEventListener('click',function(ev){var x=ev.target.closest('[data-s]');if(!x)return;closeTop();
   if(x.dataset.s==='r')promptSheet('Rename list',l.name,'Save',function(v){l.name=v;touch(l);render();});
   else confirmSheet('Delete “'+l.name+'” and all its items?','Delete',function(){S.lists=S.lists.filter(function(z){return z.id!==l.id;});save();ui.view='home';render();history.back();});});
  pushOverlay(bd);}
 else if(a==='donetoggle'){ui.doneOpen=!ui.doneOpen;render();}
 else if(a==='additem'){addItem();}
 else if(a==='toggle'){l=getList();var it=getItem(l,id);it.done=!it.done;it.doneAt=it.done?Date.now():0;touch(l);render();}
 else if(a==='edit'){openEditor(id);}
 else if(a==='img'){l=getList();viewer(getItem(l,id).images[+b.dataset.i]);}
 else if(a==='link'){l=getList();openUrl(getItem(l,id).links[+b.dataset.i].url);}
});
document.getElementById('app').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='newitem')addItem();});

dbGet('state').then(function(v){
 S=(v&&Array.isArray(v.lists))?v:seed();
 S.lists.forEach(function(l){l.items.forEach(function(i){i.labels=i.labels||[];i.images=i.images||[];i.links=i.links||[];i.priority=i.priority||0;i.desc=i.desc||'';});});
 if(!v)save();
 render();
});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&location.hostname!=='localhost'){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
</script>
</body>
